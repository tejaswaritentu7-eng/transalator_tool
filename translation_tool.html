<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon — translation tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1f23;
    --card: #f5f3ee;
    --card-edge: #d8d3c6;
    --red: #c1392b;
    --red-dark: #8f2a20;
    --teal: #2f6f62;
    --teal-light: #dcece7;
    --text-muted: #6b7280;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 40%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
    min-height: 100vh;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    padding: 0 4px;
  }

  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    color: #f5f3ee;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .masthead span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8f96;
  }

  .board {
    position: relative;
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    padding: 28px 28px 24px;
  }

  .board::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed var(--card-edge);
    border-radius: 2px;
    pointer-events: none;
  }

  .lang-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }

  .lang-field {
    flex: 1;
  }

  .lang-field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: #ffffff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%231b1f23"/></svg>') no-repeat right 12px center;
    border: 1px solid var(--card-edge);
    border-radius: 3px;
    padding: 10px 32px 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }

  select:focus {
    outline: none;
    border-color: var(--teal);
  }

  .swap-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    margin-top: 18px;
    border-radius: 50%;
    border: 1px solid var(--card-edge);
    background: #ffffff;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .swap-btn:hover {
    border-color: var(--teal);
    transform: rotate(180deg);
  }

  .swap-btn svg { width: 16px; height: 16px; }

  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: #ffffff;
    border: 1px solid var(--card-edge);
    border-radius: 3px;
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    position: relative;
    z-index: 1;
  }

  textarea:focus {
    outline: none;
    border-color: var(--teal);
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0 22px;
    position: relative;
    z-index: 1;
  }

  .char-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .stamp-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    color: #ffffff;
    background: var(--red);
    border: none;
    border-radius: 999px;
    padding: 11px 24px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .stamp-btn:hover { background: var(--red-dark); }
  .stamp-btn:active { transform: scale(0.97); }
  .stamp-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
    position: relative;
    z-index: 1;
  }

  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-top: 1px solid var(--card-edge);
  }

  .divider span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .output-panel {
    background: var(--teal-light);
    border-radius: 3px;
    padding: 18px;
    min-height: 96px;
    position: relative;
    z-index: 1;
  }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .output-header .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
    font-weight: 500;
  }

  .icon-row {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(47,111,98,0.3);
    background: #ffffff;
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:hover { background: var(--teal); color: #ffffff; }
  .icon-btn:disabled { opacity: 0.4; cursor: default; background: #ffffff; color: var(--teal); }
  .icon-btn svg { width: 15px; height: 15px; }

  #outText {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 12px;
    min-height: 14px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="page">
  <div class="masthead">
    <h1>Lexicon</h1>
    <span>Translation desk</span>
  </div>

  <div class="board">
    <div class="lang-row">
      <div class="lang-field">
        <label for="fromLang">From</label>
        <select id="fromLang">
          <option value="en" selected>English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="hi">Hindi</option>
          <option value="te">Telugu</option>
          <option value="ta">Tamil</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="ko">Korean</option>
        </select>
      </div>

      <button class="swap-btn" id="swapBtn" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>
      </button>

      <div class="lang-field">
        <label for="toLang">To</label>
        <select id="toLang">
          <option value="es" selected>Spanish</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="hi">Hindi</option>
          <option value="te">Telugu</option>
          <option value="ta">Tamil</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="ko">Korean</option>
        </select>
      </div>
    </div>

    <textarea id="srcText" placeholder="Type text to translate..."></textarea>

    <div class="meta-row">
      <span class="char-count" id="charCount">0 / 490</span>
      <button class="stamp-btn" id="translateBtn">Translate</button>
    </div>

    <div class="divider"><span>Result</span></div>

    <div class="output-panel">
      <div class="output-header">
        <span class="tag" id="outLangTag">ES</span>
        <div class="icon-row">
          <button class="icon-btn" id="speakBtn" aria-label="Listen" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <button class="icon-btn" id="copyBtn" aria-label="Copy" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
      </div>
      <p id="outText">Your translation will appear here.</p>
    </div>

    <p class="status" id="statusMsg"></p>
  </div>
</div>

<script>
  const srcText = document.getElementById('srcText');
  const charCount = document.getElementById('charCount');
  const translateBtn = document.getElementById('translateBtn');
  const outText = document.getElementById('outText');
  const outLangTag = document.getElementById('outLangTag');
  const speakBtn = document.getElementById('speakBtn');
  const copyBtn = document.getElementById('copyBtn');
  const swapBtn = document.getElementById('swapBtn');
  const fromLang = document.getElementById('fromLang');
  const toLang = document.getElementById('toLang');
  const statusMsg = document.getElementById('statusMsg');

  function updateTag() {
    outLangTag.textContent = toLang.value.toUpperCase();
  }
  updateTag();
  toLang.addEventListener('change', updateTag);

  srcText.addEventListener('input', () => {
    charCount.textContent = srcText.value.length + ' / 490';
  });

  swapBtn.addEventListener('click', () => {
    const f = fromLang.value;
    fromLang.value = toLang.value;
    toLang.value = f;
    updateTag();
  });

  async function translate() {
    const text = srcText.value.trim();
    if (!text) {
      statusMsg.textContent = 'Enter some text first.';
      return;
    }
    translateBtn.disabled = true;
    translateBtn.textContent = 'Translating...';
    statusMsg.textContent = '';
    speakBtn.disabled = true;
    copyBtn.disabled = true;

    try {
      const langpair = fromLang.value + '|' + toLang.value;
      const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 490)) + '&langpair=' + langpair;
      const res = await fetch(url);
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText;
      if (translated) {
        outText.textContent = translated;
        speakBtn.disabled = false;
        copyBtn.disabled = false;
      } else {
        statusMsg.textContent = "Couldn't translate that. Try again.";
      }
    } catch (e) {
      statusMsg.textContent = 'Translation failed. Check your connection and try again.';
    } finally {
      translateBtn.disabled = false;
      translateBtn.textContent = 'Translate';
    }
  }

  translateBtn.addEventListener('click', translate);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(outText.textContent);
      statusMsg.textContent = 'Copied to clipboard.';
      setTimeout(() => { statusMsg.textContent = ''; }, 2000);
    } catch (e) {
      statusMsg.textContent = 'Could not copy.';
    }
  });

  speakBtn.addEventListener('click', () => {
    if (!('speechSynthesis' in window)) {
      statusMsg.textContent = 'Text-to-speech is not supported here.';
      return;
    }
    const utter = new SpeechSynthesisUtterance(outText.textContent);
    utter.lang = toLang.value;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  });
</script>
</body>
</html>
